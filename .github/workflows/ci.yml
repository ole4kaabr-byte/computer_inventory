name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: Установка зависимостей
        run: |
          pip install -r requirements.txt
      - name: Запуск тестов
        run: |
          pytest
